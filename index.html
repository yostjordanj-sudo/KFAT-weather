<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="600">
<title>KFAT Regional Aviation Weather</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d131a;color:#e6edf3;font-family:Arial,sans-serif;padding:10px 14px;overflow:hidden}
table{border-collapse:collapse;width:100%}
.bar{background:#161f2c;border:1px solid #2b394a;border-radius:6px;padding:7px 12px;margin-bottom:8px}
.title{font-size:19px;font-weight:bold;color:#fff}
.clock{font-size:17px;font-weight:bold;color:#79c0ff;text-align:right}
.sub{background:#131b26;border:1px solid #263342;border-radius:6px;padding:5px 12px;margin-bottom:8px;font-size:13px;color:#c9d1d9}
.sub b{color:#fff}
.grid td{width:14.28%;vertical-align:top;padding:0 3px}
.card{background:#161f2c;border:2px solid #2b394a;border-radius:6px;padding:7px;height:215px;position:relative}
.card.alert{border-color:#f85149;background:#261418}
.icao{font-size:19px;font-weight:bold;color:#fff}
.city{font-size:10px;color:#8b949e;text-transform:uppercase;margin-bottom:5px}
.badge{display:block;text-align:center;font-size:15px;font-weight:bold;padding:3px 0;border-radius:4px;margin-bottom:6px;color:#fff}
.VFR{background:#1f7a38}.MVFR{background:#1b65b8}.IFR{background:#c92a2a}.LIFR{background:#a61e8b}.UNK{background:#3b4654}
.m{font-size:12px;margin-bottom:3px;color:#c9d1d9}.m b{color:#fff}
.taf{position:absolute;bottom:7px;left:7px;right:7px}
.taf td{width:33.3%;padding:0 1px}
.pill{text-align:center;font-size:10px;font-weight:bold;padding:3px 0;border-radius:3px;color:#fff}
.media{margin-top:8px}
.mbox{background:#161f2c;border:1px solid #2b394a;border-radius:6px;padding:7px;height:295px}
.mtitle{font-size:12px;font-weight:bold;color:#9ecbff;margin-bottom:5px;text-transform:uppercase}
.mbox img{width:100%;height:260px;object-fit:cover;background:#000;border-radius:4px}
#rad{object-fit:contain}
.foot{margin-top:8px;padding:7px;border-radius:6px;font-size:14px;font-weight:bold;text-align:center;background:#174928;border:1px solid #2ea043;color:#fff}
.foot.alert{background:#5c191d;border-color:#f85149}
</style>
</head>
<body>
<table class="bar"><tr><td class="title">KFAT REGIONAL AVIATION WEATHER</td><td class="clock" id="clk">LOADING...</td></tr></table>
<table class="sub"><tr>
<td>SUNRISE: <b id="sr">--:--</b> | SUNSET: <b id="ss">--:--</b></td>
<td style="text-align:center">MOON: <b id="mn">--</b></td>
<td style="text-align:right">FRESNO: <b id="tv">--°F</b> | SHAVER LAKE: <b id="tm">--°F</b></td>
</tr></table>
<table class="grid"><tr>
<td id="c-KFAT"></td><td id="c-KFCH"></td><td id="c-KMAE"></td><td id="c-KMCE"></td><td id="c-O32"></td><td id="c-KHJO"></td><td id="c-KVIS"></td>
</tr></table>
<table class="media"><tr>
<td style="width:40%;padding-right:5px"><div class="mbox"><div class="mtitle">NWS Hanford (KHNX) Radar</div><img id="rad" src="https://weather.gov"></div></td>
<td style="width:30%;padding:0 5px"><div class="mbox"><div class="mtitle">Owens Mountain (Foothills)</div><img id="cm" src="https://alertcalifornia.org"></div></td>
<td style="width:30%;padding-left:5px"><div class="mbox"><div class="mtitle">SR-180 @ Clovis Ave (Valley)</div><img id="cv" src="https://ca.gov"></div></td>
</tr></table>
<div class="foot" id="ft">LOADING WEATHER DATA...</div>
<script>
var MINS={dayC:800,dayV:2,ngtC:1500,ngtV:3},isNgt=false;
var STS=[{id:"KFAT",n:"Fresno",t:1},{id:"KFCH",n:"Chandler",t:0},{id:"KMAE",n:"Madera",t:0},{id:"KMCE",n:"Merced",t:1},{id:"O32",n:"Reedley",t:0,no:1},{id:"KHJO",n:"Hanford",t:0},{id:"KVIS",n:"Visalia",t:1}];
function p2(n){return(n<10?"0":"")+n}
function astro(){
  var d=new Date();
  document.getElementById("clk").innerHTML=p2(d.getUTCHours())+":"+p2(d.getUTCMinutes())+" Z | "+p2(d.getHours())+":"+p2(d.getMinutes())+" LOCAL";
  var doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  var dec=23.45*Math.sin((2*Math.PI/365)*(doy-81))*Math.PI/180;
  var ha=Math.acos(-Math.tan(36.78*Math.PI/180)*Math.tan(dec))*180/Math.PI;
  var noon=12-(-119.72/15)+(-d.getTimezoneOffset()/60);
  var r=noon-ha/15,s=noon+ha/15;
  function fh(x){var h=Math.floor(x);return p2(h)+":"+p2(Math.floor((x-h)*60))}
  document.getElementById("sr").innerHTML=fh(r);document.getElementById("ss").innerHTML=fh(s);
  var cur=d.getHours()+d.getMinutes()/60;isNgt=(cur<r||cur>s);
  var age=((d.getTime()-Date.UTC(2000,0,6,18,14))/864e5)%29.53059;if(age<0)age+=29.53059;
  var il=Math.round((1-Math.cos(2*Math.PI*age/29.53059))/2*100);
  var ph=age<1.8?"New":age<5.5?"Wax Cres":age<9.2?"1st Qtr":age<12.9?"Wax Gib":age<16.6?"Full":age<20.3?"Wan Gib":age<24?"Last Qtr":"Wan Cres";
  document.getElementById("mn").innerHTML=ph+" ("+il+"% Illum)";
}
function ceilOf(c){if(!c)return 99999;var m=99999;for(var i=0;i<c.length;i++)if((c[i].cover=="BKN"||c[i].cover=="OVC"||c[i].cover=="OVX")&&c[i].base<m)m=c[i].base;return m}
function catOf(c,v){return(c<500||v<1)?"LIFR":(c<1000||v<3)?"IFR":(c<=3000||v<=5)?"MVFR":"VFR"}
function draw(s,m,t){
  var el=document.getElementById("c-"+s.id);
  if(s.no){el.innerHTML='<div class="card"><div class="icao">'+s.id+'</div><div class="city">'+s.n+'</div><span class="badge UNK">NO AWOS</span><div class="m">Ref: KFAT/KVIS</div></div>';return 0}
  if(!m){el.innerHTML='<div class="card"><div class="icao">'+s.id+'</div><div class="city">'+s.n+'</div><span class="badge UNK">LOADING</span></div>';return 0}
  var c=ceilOf(m.clouds),v=parseFloat(String(m.visib||10).replace("+",""))||10,cat=m.fltCat||catOf(c,v);
  var bad=(c<(isNgt?MINS.ngtC:MINS.dayC)||v<(isNgt?MINS.ngtV:MINS.dayV));
  var wd=m.wspd===0?"Calm":(m.wdir!=null?("00"+m.wdir).slice(-3)+"° ":"VRB ")+(m.wspd||0)+"kt"+(m.wgst?" G"+m.wgst:"");
  var th="";
  if(s.t){
    var c0=cat,c3=cat,c6=cat,ns=Math.floor(Date.now()/1000);
    if(t&&t.fcsts)for(var i=0;i<t.fcsts.length;i++){var f=t.fcsts[i],fc=catOf(ceilOf(f.clouds),parseFloat(String(f.visib||10).replace("+",""))||10);if(f.timeFrom<=ns+10800&&f.timeTo>=ns+10800)c3=fc;if(f.timeFrom<=ns+21600&&f.timeTo>=ns+21600)c6=fc}
    th='<div class="taf"><table><tr><td><div class="pill '+c0+'">NOW</div></td><td><div class="pill '+c3+'">+3H</div></td><td><div class="pill '+c6+'">+6H</div></td></tr></table></div>';
  }
  el.innerHTML='<div class="card '+(bad?"alert":"")+'"><div class="icao">'+s.id+'</div><div class="city">'+s.n+'</div><span class="badge '+cat+'">'+cat+'</span><div class="m">Wind: <b>'+wd+'</b></div><div class="m">Vis: <b>'+v+' SM</b></div><div class="m">Ceil: <b>'+(c>=99999?"CLR":c+" ft")+'</b></div><div class="m">Wx: <b>'+(m.wxString||"None")+'</b></div>'+th+'</div>';
  return bad;
}
function getJ(u,cb){
  var x=new XMLHttpRequest();x.open("GET","https://allorigins.win"+encodeURIComponent(u),true);
  x.onreadystatechange=function(){if(x.readyState==4){try{cb(JSON.parse(x.responseText))}catch(e){cb(null)}}};x.send();
}
function loadWx(){
  getJ("https://aviationweather.gov",function(ms){
    var mm={};if(ms)for(var i=0;i<ms.length;i++)mm[ms[i].icaoId]=ms[i];
    if(mm.KFAT&&mm.KFAT.temp!=null)document.getElementById("tv").innerHTML=Math.round(mm.KFAT.temp*9/5+32)+"°F";
    getJ("https://aviationweather.gov",function(ts){
      var tm={},al=[];if(ts)for(var j=0;j<ts.length;j++)tm[ts[j].icaoId]=ts[j];
      for(var k=0;k<STS.length;k++)if(draw(STS[k],mm[STS[k].id],tm[STS[k].id]))al.push(STS[k].id);
      var ft=document.getElementById("ft"),md=isNgt?"NIGHT ("+MINS.ngtC+"ft/"+MINS.ngtV+"SM)":"DAY ("+MINS.dayC+"ft/"+MINS.dayV+"SM)";
      ft.className=al.length?"foot alert":"foot";
      ft.innerHTML=al.length?"BELOW MINIMUMS ["+md+"]: "+al.join(", "):"ALL STATIONS AT OR ABOVE MINIMUMS ["+md+"]";
    });
  });
}
function loadTemps(){
  var x=new XMLHttpRequest();x.open("GET","https://open-meteo.com",true);
  x.onreadystatechange=function(){if(x.readyState==4&&x.status==200){var d=JSON.parse(x.responseText);if(d&&d.length>=2){if(document.getElementById("tv").innerHTML.indexOf("--")!=-1)document.getElementById("tv").innerHTML=Math.round(d[0].current.temperature_2m)+"°F";document.getElementById("tm").innerHTML=Math.round(d[1].current.temperature_2m)+"°F"}}};x.send();
}
function refImg(){var t=Date.now();document.getElementById("rad").src="https://weather.gov?t="+t;document.getElementById("cm").src="https://alertcalifornia.org?t="+t;document.getElementById("cv").src="https://ca.gov?t="+t}
for(var i=0;i<STS.length;i++)draw(STS[i],null,null);
astro();loadWx();loadTemps();setInterval(astro,30000);setInterval(loadWx,180000);setInterval(loadTemps,600000);setInterval(refImg,120000);
</script>
</body>
</html>
